<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How chantier works</title>
  <desc>You talk to one Chief of Staff, which reads the project's AGENTS.md: gates, branch and team. On your go it starts one Foreman session per batch, which starts Drivers; each Driver runs short workers, any of which can be your own agent. Everything chantier writes goes to .agents/changes, as JSON and Markdown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">How chantier works</text>
  <text x="30" y="62" font-size="13" fill="#475569">One office to talk to; the coordination happens underneath, and the team can be yours.</text>

  <!-- Lanes -->
  <g font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">
    <text x="30" y="92">MAIN SESSION</text>
    <text x="30" y="226">NESTED SESSION</text>
    <text x="30" y="338">BACKGROUND</text>
    <text x="30" y="446">FOREGROUND</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="30" y1="206" x2="800" y2="206"/>
    <line x1="30" y1="320" x2="800" y2="320"/>
    <line x1="30" y1="434" x2="800" y2="434"/>
  </g>

  <!-- AGENTS.md -->
  <rect x="30" y="112" width="150" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="105" y="135" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">AGENTS.md</text>
  <text x="105" y="153" font-size="10.5" fill="#475569" text-anchor="middle">gates, branch, your team</text>
  <path d="M180,160 C230,186 280,186 326,170" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="238" y="197" font-size="10" fill="#64748b" text-anchor="middle">read each session</text>

  <!-- You -->
  <circle cx="250" cy="118" r="14" fill="#1e3a8a"/>
  <path d="M229,154 a21,18 0 0 1 42,0 z" fill="#1e3a8a"/>
  <line x1="276" y1="132" x2="326" y2="132" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Chief of Staff -->
  <rect x="330" y="96" width="300" height="88" rx="10" fill="#1e3a8a"/>
  <text x="480" y="121" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Chief of Staff</text>
  <text x="480" y="139" font-size="11" fill="#bfdbfe" text-anchor="middle">your session · Opus 5.5 recommended</text>
  <text x="480" y="157" font-size="11.5" fill="#dbeafe" text-anchor="middle">learns the project · backlog and questions</text>
  <text x="480" y="173" font-size="11.5" fill="#dbeafe" text-anchor="middle">your team · steering · status and cost</text>

  <!-- Chief of Staff ⇄ Foreman -->
  <line x1="440" y1="186" x2="440" y2="226" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="520" y1="226" x2="520" y2="188" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="434" y="214" font-size="10.5" fill="#9a3412" text-anchor="end" font-family="ui-monospace, Menlo, monospace">start, order, answer</text>
  <text x="526" y="214" font-size="10.5" fill="#9a3412" font-family="ui-monospace, Menlo, monospace">ready, ask, final</text>

  <!-- Foreman -->
  <rect x="330" y="230" width="300" height="80" rx="10" fill="#ea580c"/>
  <text x="480" y="254" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Foreman</text>
  <text x="480" y="272" font-size="11" fill="#ffedd5" text-anchor="middle">one session per batch · Opus 5.5, effort low</text>
  <text x="480" y="289" font-size="11.5" fill="#ffedd5" text-anchor="middle">event → actions; nothing else</text>
  <text x="480" y="303" font-size="10.5" fill="#fed7aa" text-anchor="middle">heartbeat 55 min (Copilot: 4 min)</text>

  <!-- Spawn note -->
  <rect x="646" y="226" width="148" height="88" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="656" y="244" font-size="10.5" font-weight="700" fill="#9a3412" font-family="ui-monospace, Menlo, monospace">chantier spawn</text>
  <g font-size="11" fill="#7c2d12">
    <text x="656" y="268">gives each role's</text>
    <text x="656" y="284">contract to any agent</text>
  </g>

  <!-- Drivers -->
  <g font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="146" y="352" width="180" height="66" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="140" y="346" width="180" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="230" y="370">CR Driver</text>
    <text x="230" y="387" font-size="10.5" font-weight="400" fill="#475569">one per CR slot</text>
    <text x="230" y="401" font-size="10.5" font-weight="400" fill="#475569">rounds, ship, CI, hand-back</text>

    <rect x="390" y="346" width="180" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="480" y="370">Stack driver</text>
    <text x="480" y="387" font-size="10.5" font-weight="400" fill="#475569">orders and restacks</text>
    <text x="480" y="401" font-size="10.5" font-weight="400" fill="#475569">a stack of PRs</text>

    <rect x="614" y="346" width="180" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="704" y="370">QA driver</text>
    <text x="704" y="387" font-size="10.5" font-weight="400" fill="#475569">uses a green CR like a user;</text>
    <text x="704" y="401" font-size="10.5" font-weight="400" fill="#475569">a finding is a new round</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M390,312 C380,334 250,326 236,342"/>
    <line x1="480" y1="312" x2="480" y2="342"/>
    <path d="M560,312 C600,330 670,328 700,342"/>
  </g>

  <!-- Workers -->
  <g font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="30" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="82" y="488">Investigator</text>
    <rect x="140" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="192" y="488">Coder</text>
    <rect x="250" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="302" y="488">Inspector</text>
    <rect x="360" y="464" width="104" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3"/><text x="412" y="481">your review</text><text x="412" y="496" font-size="10.5" font-weight="400">steps</text>
    <rect x="470" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="522" y="488">Debugger</text>
    <rect x="580" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="632" y="488">Verifier</text>
    <rect x="690" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="742" y="488">Conflict resolver</text>
  </g>
  <!-- Drivers start workers: one bus, a drop per worker -->
  <g stroke="#334155" stroke-width="1.3" fill="none">
    <line x1="300" y1="418" x2="300" y2="454"/>
    <line x1="82" y1="454" x2="742" y2="454"/>
  </g>
  <!-- The stack driver starts only the conflict resolver -->
  <path d="M530,414 V428 H782 V461" stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <g stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="82" y1="454" x2="82" y2="462"/>
    <line x1="192" y1="454" x2="192" y2="462"/>
    <line x1="302" y1="454" x2="302" y2="462"/>
    <line x1="412" y1="454" x2="412" y2="462"/>
    <line x1="522" y1="454" x2="522" y2="462"/>
    <line x1="632" y1="454" x2="632" y2="462"/>
    <line x1="742" y1="454" x2="742" y2="462"/>
  </g>
  <g font-size="11" fill="#475569">
    <text x="30" y="530"><tspan fill="#a16207" font-weight="600">Any role can run your own agent</tspan>, named in AGENTS.md; a new name adds a review step.</text>
  </g>

  <!-- Storage -->
  <rect x="30" y="574" width="764" height="122" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="599" font-size="12.5" font-weight="700" fill="#0f172a">Everything chantier writes: .agents/changes/, as JSON and Markdown</text>
  <g font-size="11" fill="#334155" font-family="ui-monospace, Menlo, monospace">
    <text x="46" y="628">backlog/   1-inbox → 2-backlog/P1…P4 → 3-requests → 4-archives</text>
    <text x="46" y="652">batches/   batch.json · events.jsonl · brief.md · report.md</text>
  </g>
  <text x="46" y="678" font-size="11" fill="#475569">Each CR: its request, your answers, its specification, and a branch and worktree next to the repository.</text>

  <!-- chantier CLI -->
  <rect x="830" y="96" width="240" height="400" rx="12" fill="#0f172a"/>
  <text x="950" y="124" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">chantier</text>
  <text x="950" y="142" font-size="11" fill="#cbd5e1" text-anchor="middle">Python CLI, no dependency (uv run)</text>
  <g font-size="11.5" fill="#e2e8f0">
    <text x="848" y="190">Every mechanical step:</text>
    <text x="848" y="210">open, spawn, gates, ship,</text>
    <text x="848" y="230">wait for CI, cost.</text>
  </g>
  <line x1="848" y1="254" x2="1052" y2="254" stroke="#334155"/>
  <g font-size="11.5" fill="#cbd5e1">
    <text x="848" y="280">Owns every state change:</text>
    <text x="848" y="300">locked, atomic, logged.</text>
  </g>
  <g font-size="11.5" fill="#fdba74">
    <text x="848" y="334">Fails fast: no look-alike model,</text>
    <text x="848" y="354">no fallback tool or agent,</text>
    <text x="848" y="374">no estimated cost.</text>
  </g>
  <g stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="634" y1="132" x2="826" y2="132"/>
    <line x1="798" y1="270" x2="826" y2="270"/>
    <line x1="798" y1="380" x2="826" y2="380"/>
    <line x1="798" y1="484" x2="826" y2="484"/>
  </g>

  <!-- Hosts -->
  <rect x="830" y="574" width="240" height="122" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="846" y="597" font-size="12.5" font-weight="700" fill="#0f172a">Hosts</text>
  <g font-size="11" fill="#334155">
    <text x="846" y="619">Claude Desktop</text>
    <text x="846" y="634" font-size="10.5" fill="#64748b">start_session + detach</text>
    <text x="846" y="655">Copilot SDK host</text>
    <text x="846" y="670" font-size="10.5" fill="#64748b">create_session + /every</text>
  </g>
  <text x="846" y="688" font-size="10.5" fill="#b91c1c">Anything else: refused, no fallback.</text>
</svg>
