<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How chantier works</title>
  <desc>The user talks to one Chief of Staff. It starts one Foreman per batch in a nested session. The Foreman runs Drivers as background subagents; each Driver runs short foreground workers. Every role does its mechanical steps through the chantier CLI, which owns the batch state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">How chantier works</text>
  <text x="30" y="62" font-size="13" fill="#475569">One office to talk to; the coordination happens underneath.</text>

  <g font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">
    <text x="30" y="112">MAIN SESSION</text>
    <text x="30" y="232">NESTED SESSION</text>
    <text x="30" y="327">BACKGROUND SUBAGENTS</text>
    <text x="40" y="524">FOREGROUND WORKERS</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="30" y1="194" x2="780" y2="194"/>
    <line x1="30" y1="310" x2="780" y2="310"/>
    <line x1="30" y1="432" x2="780" y2="432"/>
  </g>

  <!-- User -->
  <circle cx="230" cy="132" r="16" fill="#1e3a8a"/>
  <path d="M206,174 a24,20 0 0 1 48,0 z" fill="#1e3a8a"/>
  <text x="230" y="104" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">You</text>
  <line x1="262" y1="142" x2="344" y2="142" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Chief of Staff -->
  <rect x="350" y="100" width="240" height="76" rx="10" fill="#1e3a8a"/>
  <text x="470" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Chief of Staff</text>
  <text x="470" y="148" font-size="11.5" fill="#dbeafe" text-anchor="middle">backlog, questions, steering</text>
  <text x="470" y="164" font-size="11.5" fill="#dbeafe" text-anchor="middle">status and cost on request</text>

  <!-- Foreman -->
  <rect x="350" y="214" width="240" height="76" rx="10" fill="#ea580c"/>
  <text x="470" y="242" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Foreman</text>
  <text x="470" y="262" font-size="11.5" fill="#ffedd5" text-anchor="middle">one per batch, kept warm</text>
  <text x="470" y="278" font-size="11.5" fill="#ffedd5" text-anchor="middle">by a heartbeat</text>

  <line x1="430" y1="178" x2="430" y2="210" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="510" y1="212" x2="510" y2="180" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="424" y="199" font-size="10.5" fill="#9a3412" text-anchor="end" font-family="ui-monospace, Menlo, monospace">order, answer</text>
  <text x="516" y="199" font-size="10.5" fill="#9a3412" font-family="ui-monospace, Menlo, monospace">ready, ask, final</text>

  <!-- Drivers -->
  <g font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="166" y="346" width="150" height="62" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="160" y="340" width="150" height="62" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="235" y="366">CR Driver</text>
    <text x="235" y="385" font-size="11" font-weight="400" fill="#475569">one per CR slot</text>

    <rect x="395" y="340" width="150" height="62" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="470" y="366">Stack driver</text>
    <text x="470" y="385" font-size="11" font-weight="400" fill="#475569">orders a PR stack</text>

    <rect x="610" y="340" width="150" height="62" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="685" y="366">QA driver</text>
    <text x="685" y="385" font-size="11" font-weight="400" fill="#475569">checks a green CR</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M410,292 C370,315 280,315 240,336"/>
    <line x1="470" y1="292" x2="470" y2="336"/>
    <path d="M530,292 C570,315 650,315 680,336"/>
  </g>

  <!-- Workers -->
  <g font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="462" width="110" height="40" rx="8" fill="#e0e7ff"/><text x="95" y="487">Investigator</text>
    <rect x="160" y="462" width="110" height="40" rx="8" fill="#e0e7ff"/><text x="215" y="487">Coder</text>
    <rect x="280" y="462" width="110" height="40" rx="8" fill="#e0e7ff"/><text x="335" y="487">Inspector</text>
    <rect x="400" y="462" width="110" height="40" rx="8" fill="#e0e7ff"/><text x="455" y="487">Debugger</text>
    <rect x="520" y="462" width="110" height="40" rx="8" fill="#e0e7ff"/><text x="575" y="487">Verifier</text>
    <rect x="640" y="462" width="130" height="40" rx="8" fill="#e0e7ff"/><text x="705" y="487">Conflict resolver</text>
  </g>
  <g stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="195" y1="410" x2="105" y2="458"/>
    <line x1="215" y1="410" x2="215" y2="458"/>
    <line x1="235" y1="410" x2="325" y2="458"/>
    <line x1="255" y1="410" x2="445" y2="458"/>
    <line x1="275" y1="410" x2="565" y2="458"/>
    <line x1="500" y1="404" x2="690" y2="458"/>
  </g>
  <text x="250" y="524" font-size="11" fill="#475569">Each worker runs one short task on the model chosen for its role, then returns.</text>

  <!-- CR workspace -->
  <rect x="40" y="556" width="420" height="80" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="56" y="580" font-size="12.5" font-weight="700" fill="#0f172a">Change Request folder + git worktree</text>
  <text x="56" y="601" font-size="11" fill="#334155" font-family="ui-monospace, Menlo, monospace">intake/  01-intent.md  02-answers.md</text>
  <text x="56" y="620" font-size="11" fill="#334155" font-family="ui-monospace, Menlo, monospace">03-change-spec.md  research/  → branch → PR</text>
  <line x1="215" y1="504" x2="215" y2="552" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- chantier CLI -->
  <rect x="800" y="100" width="170" height="402" rx="12" fill="#0f172a"/>
  <text x="885" y="130" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">chantier</text>
  <text x="885" y="148" font-size="11" fill="#cbd5e1" text-anchor="middle">Python CLI (uv run)</text>
  <g font-size="11.5" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace">
    <text x="820" y="184">setup / preflight</text>
    <text x="820" y="206">models</text>
    <text x="820" y="228">open / order</text>
    <text x="820" y="250">event → actions</text>
    <text x="820" y="272">gate / wait / ci</text>
    <text x="820" y="294">ship / land</text>
    <text x="820" y="316">status / cost</text>
  </g>
  <line x1="818" y1="336" x2="952" y2="336" stroke="#334155"/>
  <text x="820" y="358" font-size="11" fill="#cbd5e1">Owns the batch state:</text>
  <text x="820" y="376" font-size="11" fill="#cbd5e1">slots, rounds, budget,</text>
  <text x="820" y="394" font-size="11" fill="#cbd5e1">exact model per role.</text>
  <text x="820" y="424" font-size="11" fill="#fdba74">Fails fast: no look-alike</text>
  <text x="820" y="442" font-size="11" fill="#fdba74">model, no fallback tool.</text>
  <g stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="594" y1="138" x2="796" y2="138"/>
    <line x1="594" y1="252" x2="796" y2="252"/>
    <line x1="764" y1="371" x2="796" y2="371"/>
    <line x1="774" y1="482" x2="796" y2="482"/>
  </g>

  <!-- Hosts -->
  <text x="800" y="556" font-size="12.5" font-weight="700" fill="#0f172a">Hosts</text>
  <text x="800" y="578" font-size="11.5" fill="#334155">Claude Desktop</text>
  <text x="800" y="596" font-size="11.5" fill="#334155">Copilot SDK host</text>
  <text x="800" y="620" font-size="11" fill="#64748b">Anything else: refused.</text>
</svg>
