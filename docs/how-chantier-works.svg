<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How chantier works</title>
  <desc>You talk to one Chief of Staff, which reads the project's AGENTS.md. On your go it starts one Foreman session per batch, which starts Drivers; each Driver runs short workers, any of which can be your own agent. The agents do the work with git, gh and glab. The chantier CLI is their frame: the change-request lifecycle, the limits and the means to synchronise. It writes only in .agents/changes, as JSON and Markdown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">How chantier works</text>
  <text x="30" y="62" font-size="13" fill="#475569">One office to talk to; the agents do the work, and the CLI is their frame.</text>

  <!-- Lanes -->
  <g font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">
    <text x="30" y="92">MAIN SESSION</text>
    <text x="30" y="226">NESTED SESSION</text>
    <text x="30" y="338">BACKGROUND</text>
    <text x="30" y="446">FOREGROUND</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="30" y1="206" x2="800" y2="206"/>
    <line x1="30" y1="320" x2="800" y2="320"/>
    <line x1="30" y1="434" x2="800" y2="434"/>
  </g>

  <!-- AGENTS.md -->
  <rect x="30" y="112" width="150" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="105" y="135" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">AGENTS.md</text>
  <text x="105" y="153" font-size="10.5" fill="#475569" text-anchor="middle">your rules, your team</text>
  <path d="M180,160 C230,186 280,186 326,170" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- You -->
  <circle cx="250" cy="118" r="14" fill="#1e3a8a"/>
  <path d="M229,154 a21,18 0 0 1 42,0 z" fill="#1e3a8a"/>
  <line x1="276" y1="132" x2="326" y2="132" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Chief of Staff -->
  <rect x="330" y="96" width="300" height="88" rx="10" fill="#1e3a8a"/>
  <text x="480" y="132" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Chief of Staff</text>
  <text x="480" y="156" font-size="11.5" fill="#dbeafe" text-anchor="middle">your session · backlog, questions, your team</text>

  <!-- Chief of Staff ⇄ Foreman -->
  <line x1="440" y1="186" x2="440" y2="226" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="520" y1="226" x2="520" y2="188" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="434" y="214" font-size="10.5" fill="#9a3412" text-anchor="end" font-family="ui-monospace, Menlo, monospace">orders</text>
  <text x="526" y="214" font-size="10.5" fill="#9a3412" font-family="ui-monospace, Menlo, monospace">asks</text>

  <!-- Foreman -->
  <rect x="330" y="230" width="300" height="80" rx="10" fill="#ea580c"/>
  <text x="480" y="263" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Foreman</text>
  <text x="480" y="287" font-size="11.5" fill="#ffedd5" text-anchor="middle">one session per batch · Opus 5.5 · orchestrates</text>

  <!-- Drivers -->
  <g font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="36" y="352" width="176" height="66" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="30" y="346" width="176" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="118" y="374">CR Driver</text>
    <text x="118" y="393" font-size="10.5" font-weight="400" fill="#475569">one PR per CR</text>

    <rect x="226" y="346" width="176" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="314" y="374">Stack driver</text>
    <text x="314" y="393" font-size="10.5" font-weight="400" fill="#475569">a stack of PRs</text>

    <rect x="422" y="346" width="176" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="510" y="374">QA driver</text>
    <text x="510" y="393" font-size="10.5" font-weight="400" fill="#475569">uses the CR like a user</text>

    <rect x="618" y="346" width="176" height="66" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="706" y="374">Release driver</text>
    <text x="706" y="393" font-size="10.5" font-weight="400" fill="#475569">your release procedure</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M370,312 C350,334 130,326 118,342"/>
    <path d="M450,312 C440,330 330,328 314,342"/>
    <line x1="510" y1="312" x2="510" y2="342"/>
    <path d="M590,312 C620,330 690,328 706,342"/>
  </g>

  <!-- Workers -->
  <g font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="30" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="82" y="488">Investigator</text>
    <rect x="140" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="192" y="488">Coder</text>
    <rect x="250" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="302" y="488">Inspector</text>
    <rect x="360" y="464" width="104" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3"/><text x="412" y="488">your reviews</text>
    <rect x="470" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="522" y="488">Debugger</text>
    <rect x="580" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="632" y="488">Verifier</text>
    <rect x="690" y="464" width="104" height="40" rx="8" fill="#e0e7ff"/><text x="742" y="488">Conflict resolver</text>
  </g>
  <!-- Drivers start workers: one bus, a drop per worker -->
  <g stroke="#334155" stroke-width="1.3" fill="none">
    <line x1="118" y1="418" x2="118" y2="454"/>
    <line x1="82" y1="454" x2="742" y2="454"/>
  </g>
  <!-- The stack driver starts only the conflict resolver -->
  <path d="M314,414 V428 H782 V461" stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <g stroke="#334155" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="82" y1="454" x2="82" y2="462"/>
    <line x1="192" y1="454" x2="192" y2="462"/>
    <line x1="302" y1="454" x2="302" y2="462"/>
    <line x1="412" y1="454" x2="412" y2="462"/>
    <line x1="522" y1="454" x2="522" y2="462"/>
    <line x1="632" y1="454" x2="632" y2="462"/>
    <line x1="742" y1="454" x2="742" y2="462"/>
  </g>
  <text x="30" y="528" font-size="11" fill="#475569"><tspan fill="#a16207" font-weight="600">Any role can run your own agent</tspan>, named in AGENTS.md.</text>

  <!-- Storage -->
  <rect x="30" y="548" width="764" height="76" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="577" font-size="12.5" font-weight="700" fill="#0f172a">.agents/changes/, as JSON and Markdown</text>
  <text x="46" y="603" font-size="11" fill="#334155" font-family="ui-monospace, Menlo, monospace">1-inbox → 2-backlog → 3-requests → 4-archives · 5-trash</text>

  <!-- chantier CLI -->
  <rect x="830" y="96" width="240" height="408" rx="12" fill="#0f172a"/>
  <text x="950" y="128" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">chantier</text>
  <text x="950" y="148" font-size="11" fill="#cbd5e1" text-anchor="middle">Python CLI, no dependency</text>
  <line x1="848" y1="170" x2="1052" y2="170" stroke="#334155"/>
  <g font-size="12" font-weight="700" fill="#e2e8f0">
    <text x="848" y="200">CR lifecycle</text>
    <text x="848" y="268">Frame</text>
    <text x="848" y="336">Sync</text>
  </g>
  <g font-size="11.5" fill="#cbd5e1">
    <text x="848" y="220">open, take, ship, land</text>
    <text x="848" y="288">slots, budget, rounds</text>
    <text x="848" y="356">orders, asks, notes</text>
  </g>
  <line x1="848" y1="388" x2="1052" y2="388" stroke="#334155"/>
  <g font-size="11.5" fill="#fdba74">
    <text x="848" y="418">The agents run git, gh, glab.</text>
    <text x="848" y="438">No fallback.</text>
  </g>
  <g stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="634" y1="132" x2="826" y2="132"/>
    <line x1="634" y1="270" x2="826" y2="270"/>
    <line x1="798" y1="380" x2="826" y2="380"/>
    <line x1="798" y1="484" x2="826" y2="484"/>
  </g>

  <!-- Hosts -->
  <rect x="830" y="548" width="240" height="76" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="846" y="571" font-size="12.5" font-weight="700" fill="#0f172a">Hosts</text>
  <g font-size="11" fill="#334155">
    <text x="846" y="592">Claude Desktop</text>
    <text x="846" y="610">Copilot SDK host</text>
  </g>
</svg>
