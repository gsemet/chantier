<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>How chantier works</title>
  <desc>You talk to the Chief of Staff. The Foreman orchestrates a batch. Drivers and workers do the work with git and the forge. The chantier CLI is the frame beside them: the change-request lifecycle, the limits, the record, the lines that synchronise; it lives in .agents/changes.</desc>
  <style>
    .box { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .you { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .cli { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.5; }
    .h { fill: #0f172a; font-weight: 700; font-size: 16px; }
    .s { fill: #334155; font-size: 13px; }
    .l { fill: #64748b; font-size: 13px; }
    .m { fill: #0c4a6e; font-size: 12.5px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .sync { stroke: #0369a1; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- you -->
  <rect class="you" x="40" y="40" width="200" height="64" rx="10"/>
  <text class="h" x="60" y="66">You</text>
  <text class="s" x="60" y="88">file, prioritize, go, merge</text>

  <!-- chief of staff -->
  <rect class="box" x="40" y="170" width="200" height="64" rx="10"/>
  <text class="h" x="60" y="196">Chief of Staff</text>
  <text class="s" x="60" y="218">your session, the backlog</text>

  <!-- foreman -->
  <rect class="box" x="330" y="170" width="200" height="64" rx="10"/>
  <text class="h" x="350" y="196">Foreman</text>
  <text class="s" x="350" y="218">one session per batch</text>

  <!-- drivers and workers -->
  <rect class="box" x="620" y="140" width="300" height="124" rx="10"/>
  <text class="h" x="640" y="166">Drivers and workers</text>
  <text class="s" x="640" y="188">one Driver per change request;</text>
  <text class="s" x="640" y="206">coder, inspector, verifier…</text>
  <text class="s" x="640" y="232">worktree, commits, pull request, CI</text>
  <text class="s" x="640" y="250">with git, gh and glab</text>

  <!-- arrows between people -->
  <path class="arrow" d="M 132 104 L 132 170"/>
  <path class="arrow" d="M 148 170 L 148 104"/>
  <text class="l" x="160" y="142">talk</text>
  <path class="arrow" d="M 240 194 L 330 194"/>
  <text class="l" x="262" y="188">orders</text>
  <path class="arrow" d="M 330 214 L 240 214"/>
  <text class="l" x="268" y="232">asks</text>
  <path class="arrow" d="M 530 202 L 620 202"/>
  <text class="l" x="553" y="196">starts</text>

  <!-- the CLI: the frame -->
  <rect class="cli" x="40" y="300" width="880" height="70" rx="10"/>
  <text class="h" x="60" y="326" fill="#0c4a6e">chantier CLI — the frame</text>
  <text class="s" x="60" y="350">change-request lifecycle · limits: slots, budget, rounds · the record · orders, asks, hand-backs</text>
  <text class="m" x="700" y="326">.agents/changes/</text>
  <text class="m" x="700" y="350">JSON and Markdown</text>
  <path class="sync" d="M 140 234 L 140 300"/>
  <path class="sync" d="M 430 234 L 430 300"/>
  <path class="sync" d="M 770 264 L 770 300"/>
</svg>
