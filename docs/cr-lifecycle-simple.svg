  <text x="189" y="536" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">🚜 CR driver</text>
  <text x="189" y="556" font-size="13.5" fill="#475569" text-anchor="middle">own worktree · branch</text>
  <rect x="76" y="568" width="88" height="30" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="120" y="588" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">🔨 Coder</text>
  <rect x="200" y="568" width="102" height="30" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="251" y="588" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">📏 Inspector</text>
  <line x1="168" y1="577" x2="198" y2="577" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="198" y1="589" x2="168" y2="589" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="189" y="622" font-size="13" fill="#64748b" text-anchor="middle"><tspan font-family="ui-monospace, Menlo, monospace">3-requests/</tspan> · ≤ 3 rounds</text>
  <line x1="314" y1="571" x2="362" y2="571" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364" y="506" width="210" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="469" y="536" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">🚀 PR</text>
  <text x="469" y="560" font-size="13.5" fill="#475569" text-anchor="middle">rebase · gate · ship</text>
  <text x="469" y="580" font-size="13.5" fill="#475569" text-anchor="middle">🧪 CI · ✅ Verifier</text>
  <text x="469" y="622" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">3-requests/</text>
  <path d="M469,506 V480 H189 V504" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="329" y="472" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">🔴 red → new round</text>
  <line x1="574" y1="571" x2="628" y2="571" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="630" y="506" width="170" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="536" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">👤 you merge</text>
  <text x="715" y="560" font-size="13.5" fill="#475569" text-anchor="middle">the PR/MR</text>
  <line x1="800" y1="571" x2="834" y2="571" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
