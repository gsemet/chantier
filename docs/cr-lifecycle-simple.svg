  <text x="926" y="622" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">4-archives/</text>
  <text x="335" y="744" font-size="13" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="1">OPTIONAL</text>
