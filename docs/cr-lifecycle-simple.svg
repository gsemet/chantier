<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 898" width="1040" height="898" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">
  <title>Life of a change request, in short</title>
  <desc>A change request (CR) is one folder in .agents/changes/ and usually becomes one pull or merge request (PR/MR). Agents do the work; you decide at four points: triage, spec, go and merge. Plan, with the Chief of Staff: a request from the intake (Jira, GitLab, GitHub, the chat or a finding) is filed in 1-inbox/; you triage it with the Chief of Staff, who drops it, clarifies it or writes the spec, 03-change-spec.md, that you approve; it then waits in 2-backlog/ with a priority P1 to P4 until your go. Build, run by the Foreman in 3-requests/: one CR driver per CR, in its own worktree and branch, runs rounds of a Coder and an Inspector, at most 3; it rebases, passes the gate and ships a PR; CI and the Verifier check the pushed head, and a red result starts a new round. Merge: you merge the PR and the CR moves to 4-archives/ with its retro and final status. Optional: the stack driver orders, restacks and ships stacked PRs; on your request a QA driver uses the project's head as a user; the release driver runs your release procedure, with at most 3 fix CRs. Out-of-scope bugs, QA findings and the release retro go back to the intake as findings. Each stage is a folder; the chantier CLI moves it. At any time, chantier order drop moves a CR to 5-trash/.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1040" height="898" fill="#f8fafc"/>
  <text x="24" y="52" font-size="30" font-weight="700" fill="#0f172a">🔄 Life of a change request, in short</text>
  <text x="24" y="84" font-size="16" fill="#475569">One CR, one folder, usually one PR/MR. Agents do the work; you decide at four points: triage, spec, go, merge.</text>
  <text x="24" y="108" font-size="13.5" fill="#334155">👤 you · 🤵 Chief of Staff · 👷 Foreman · 🚜 driver · 🔨 worker</text>
  <rect x="64" y="128" width="952" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="151" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">PLAN · 🤵 Chief of Staff, with you</text>
  <rect x="64" y="182" width="208" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="212" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">📨 Intake</text>
  <text x="168" y="236" font-size="13.5" fill="#475569" text-anchor="middle">Jira, GitLab, GitHub,</text>
  <text x="168" y="256" font-size="13.5" fill="#475569" text-anchor="middle">chat, findings</text>
  <line x1="272" y1="247" x2="310" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="312" y="182" width="208" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="416" y="212" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">⚖️ Triage</text>
  <text x="416" y="236" font-size="13.5" fill="#475569" text-anchor="middle">🤵 with 👤 you</text>
  <text x="416" y="256" font-size="13.5" fill="#475569" text-anchor="middle">drop · clarify · spec</text>
  <text x="416" y="298" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">1-inbox/</text>
  <line x1="520" y1="247" x2="558" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="182" width="208" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="664" y="212" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">📐 Spec</text>
  <text x="664" y="236" font-size="13.5" fill="#475569" text-anchor="middle"><tspan font-family="ui-monospace, Menlo, monospace" font-size="12.5">03-change-spec.md</tspan></text>
  <text x="664" y="256" font-size="13.5" fill="#475569" text-anchor="middle">👤 you approve</text>
  <text x="664" y="298" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">1-inbox/</text>
  <line x1="768" y1="247" x2="806" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="808" y="182" width="208" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="912" y="212" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">📋 Backlog</text>
  <text x="912" y="236" font-size="13.5" fill="#475569" text-anchor="middle">P1…P4, set by you</text>
  <text x="912" y="256" font-size="13.5" fill="#475569" text-anchor="middle">👤 your go starts it</text>
  <text x="912" y="298" font-size="13" fill="#64748b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2-backlog/</text>
  <path d="M912,312 V362 H40 V571 H62" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="412" width="510" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="319" y="435" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle" letter-spacing="0.5">BUILD · 👷 Foreman runs the batch</text>
