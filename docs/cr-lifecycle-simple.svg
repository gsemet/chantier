  <text x="125.0" y="288" font-size="13.5" fill="#475569" text-anchor="middle">chat, findings</text>
  <line x1="210" y1="279.0" x2="252" y2="279.0" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
