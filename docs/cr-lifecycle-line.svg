<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">
  <title>Life of a change request, in one line</title>
  <desc>A change request (CR) goes through ten steps, in one line, from your request to your merge, and each step names who acts. Intent: you. Grill: the Chief of Staff or a Griller, with you. Spec: the spec-writer. Spec critic, drawn dashed because it does not always run: the spec critic, when impactful. Driver: the CR driver, with its Coder, Inspector, gate and CI. Verifier: the Verifier. Ready locally, drawn dashed and rare, no PR yet: the driver hands back. PR in draft: the driver opens the PR. Ready to merge: the driver, or the stack driver, takes the PR out of draft. You merge the PR/MR.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="290" fill="#f8fafc"/>
  <text x="16" y="44" font-size="30" font-weight="700" fill="#0f172a">🔄 Life of a change request, in one line</text>
  <text x="16" y="72" font-size="16" fill="#475569">From your request to your merge, step by step, and who acts at each step.</text>
  <text x="16" y="98" font-size="13.5" fill="#334155">👤 you · 🤵 Chief of Staff · 🔥 Griller (optional) · ✍️ spec-writer · 🧐 spec critic · 🚜 driver · 🔨 worker · 🧱 stack driver</text>
  <rect x="8.0" y="124" width="68.2" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="42.1" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Intent</text>
  <text x="42.1" y="180" font-size="13.5" fill="#475569" text-anchor="middle">👤 you</text>
  <line x1="76.2" y1="199.0" x2="86.2" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="88.2" y="124" width="90.2" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="133.3" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Grill</text>
  <text x="133.3" y="180" font-size="13.5" fill="#475569" text-anchor="middle">🤵 or 🔥,</text>
  <text x="133.3" y="200" font-size="13.5" fill="#475569" text-anchor="middle">with 👤 you</text>
  <line x1="178.4" y1="199.0" x2="188.4" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190.4" y="124" width="88.2" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="234.5" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Spec</text>
  <text x="234.5" y="180" font-size="13.5" fill="#475569" text-anchor="middle">✍️</text>
  <text x="234.5" y="200" font-size="13.5" fill="#475569" text-anchor="middle">spec-writer</text>
  <line x1="278.6" y1="199.0" x2="288.6" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290.6" y="124" width="102.2" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="341.7" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Spec critic</text>
  <text x="341.7" y="180" font-size="13.5" fill="#475569" text-anchor="middle">🧐 spec critic</text>
  <text x="341.7" y="200" font-size="13.5" fill="#475569" text-anchor="middle">when</text>
  <text x="341.7" y="220" font-size="13.5" fill="#475569" text-anchor="middle">impactful</text>
  <line x1="392.8" y1="199.0" x2="402.8" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="404.8" y="124" width="94.2" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="451.9" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Driver</text>
  <text x="451.9" y="180" font-size="13.5" fill="#475569" text-anchor="middle">🚜 CR driver</text>
  <text x="451.9" y="200" font-size="13.5" fill="#475569" text-anchor="middle">🔨 Coder ·</text>
  <text x="451.9" y="220" font-size="13.5" fill="#475569" text-anchor="middle">📏 Inspector</text>
  <text x="451.9" y="240" font-size="13.5" fill="#475569" text-anchor="middle">gate · 🧪 CI</text>
  <line x1="499.0" y1="199.0" x2="509.0" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="511.0" y="124" width="80.2" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="551.1" y="156" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Verifier</text>
  <text x="551.1" y="180" font-size="13.5" fill="#475569" text-anchor="middle">✅ Verifier</text>
  <line x1="591.2" y1="199.0" x2="601.2" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="603.2" y="124" width="92.2" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="649.3" y="156" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">🟣 Ready</text>
  <text x="649.3" y="178" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">locally</text>
  <text x="649.3" y="202" font-size="13.5" fill="#475569" text-anchor="middle">🚜 hands</text>
  <text x="649.3" y="222" font-size="13.5" fill="#475569" text-anchor="middle">back</text>
  <text x="649.3" y="242" font-size="13.5" fill="#475569" text-anchor="middle">rare:</text>
  <text x="649.3" y="262" font-size="13.5" fill="#475569" text-anchor="middle">no PR yet</text>
  <line x1="695.4" y1="199.0" x2="705.4" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="707.4" y="124" width="84.2" height="150" rx="12" fill="#fdf8f6" stroke="#92400e" stroke-width="2"/>
  <text x="749.5" y="156" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">🟤 PR in</text>
  <text x="749.5" y="178" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">draft</text>
  <text x="749.5" y="202" font-size="13.5" fill="#475569" text-anchor="middle">🚜 opens</text>
  <text x="749.5" y="222" font-size="13.5" fill="#475569" text-anchor="middle">the PR</text>
  <line x1="791.6" y1="199.0" x2="801.6" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="803.6" y="124" width="92.2" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="849.7" y="156" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">🟢 Ready</text>
  <text x="849.7" y="178" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">to merge</text>
  <text x="849.7" y="202" font-size="13.5" fill="#475569" text-anchor="middle">🚜 or 🧱,</text>
  <text x="849.7" y="222" font-size="13.5" fill="#475569" text-anchor="middle">out of draft</text>
  <line x1="895.8" y1="199.0" x2="905.8" y2="199.0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="907.8" y="124" width="84.2" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="949.9" y="156" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">👤 you</text>
  <text x="949.9" y="178" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">merge</text>
  <text x="949.9" y="202" font-size="13.5" fill="#475569" text-anchor="middle">the PR/MR</text>
</svg>
