<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 556" width="1240" height="556" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">
  <title>Batches set the pace</title>
  <desc>Three batches along main, which is the time axis. Under the red line, 3 lanes are the slots: at most 3 Drivers run at once. Above it, CRs wait. batch-06 is a stack: the release CR is a CR of the batch, it waits for every other CR, runs in a slot once they are ready, and its PR is the top of the stack; you merge the whole stack in one merge, from the bottom up, and the project's release procedure then runs. batch-07 is parallel: each CR is merged by you as it ends, CRs wait for each other, one is added during the run, one is pushed to the next batch; the release CR waits for every one of them, runs in a slot after the merges, and you merge its PR last, after which the release procedure runs. batch-08 runs a QA in one slot: it reads the head of main, changes nothing, merges nothing, and its findings become new CRs.</desc>
