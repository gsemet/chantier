  <text x="24" y="82" font-size="16" fill="#475569">A CR is one folder of Markdown files in <tspan font-family="ui-monospace, Menlo, monospace">.agents/changes/</tspan>.</text>
  <text x="24" y="104" font-size="16" fill="#475569">Folder moves from stage to stage, never copied, gaining files on the way.</text>
