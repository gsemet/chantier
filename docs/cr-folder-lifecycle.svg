<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 664" width="1880" height="664" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">
  <title>A CR is a folder that moves</title>
  <desc>A change request is one folder of Markdown files in .agents/changes/; its life is that folder moving from stage to stage, never copied, and gaining files on the way. A request from the intake (a Jira issue, a GitLab or GitHub issue, the chat, a Markdown file, or QA and retro findings) is converted to Markdown and filed with chantier file into 1-inbox/&lt;slug&gt;/, with intake/ as received and 01-intent.md, the request summarised; 02-answers.md holds your answers if you are grilled, 03-change-spec.md the spec. chantier triage moves a ready CR to 2-backlog/P1…P4/&lt;slug&gt;/; nothing new, you set its priority. To start its implementation, chantier open moves it into a batch, 3-requests/&lt;NN&gt;-&lt;batch&gt;/&lt;number&gt;-&lt;slug&gt;/, where it gains STATUS.md and STATUS.json, written by the CLI; work/, written while it runs: notes, gate logs, the PR body, and for a release CR retro.md and fix-&lt;n&gt;.md; and evidence/, the QA and Verifier proofs. Once its PR or MR is merged, chantier order merged moves it to 4-archives/&lt;YYMMDD-HHMM&gt;-&lt;number&gt;-&lt;slug&gt;/, where it gains retro.md, its retro and final status. At any stage before the archive, chantier order drop moves it to 5-trash/, with its work.</desc>
