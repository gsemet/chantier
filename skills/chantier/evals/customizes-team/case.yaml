schema_version: "1.1"
name: customizes-team
description: The user changes the team in plain words; the Chief of Staff writes it in AGENTS.md.
tags: [roles, agents]
context:
  scaffold_script: place-files.sh
execution:
  prompt: |
    chantier : pour ce projet, utilise mon agent rust-coder comme coder, et ajoute une revue de
    sécurité faite par mon agent sec-reviewer, qui cherche les failles OWASP dans le diff.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read, Edit, Write, Glob, Grep]
runs: 3
expected_outcome: >-
  The agent adds a `chantier` section to AGENTS.md naming rust-coder as the coder and a security
  review step by sec-reviewer with what it checks, shows the user the lines, and says in French
  that the next batch will run with this team. It changes no agent file.
graders:
  - type: llm
    name: writes-the-team-in-agents-md
    focus: trace
    criteria: >-
      AGENTS.md was edited to add a chantier section (or lines) naming `rust-coder` for the coder
      role and a review step run by `sec-reviewer` with what it checks (OWASP, security flaws in the
      diff). No agent file under .claude/agents was edited, and no other configuration file was
      written.
  - type: llm
    name: explains-the-new-team
    focus: last_message
    criteria: >-
      The final message, in French, says the coder will be rust-coder and that a security review
      by sec-reviewer was added as an extra step, from the next batch on.
  - type: tool_used
    name: skill-fired
    tool: Skill
    min: 1
