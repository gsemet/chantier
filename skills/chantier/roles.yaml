# The plugin's roles, as data. Read by `chantier brief`, `chantier help --for` and
# scripts/roles_check.py (`just roles`). The agent files of both hosts (agents/ and
# com.github.copilot/agents/) stay hand-written: `just roles` checks them against this file.
# It lists the plugin's roles only; a project's own roles are not read from here.
# Fields: kind (steering | driver | worker | review-step | critic); started_by (role names, a
# kind, user or surface-server); writes (none | worktree | cr-folder); reply (<file>[#<heading>]
# under references/, or none); card (relative to references/); first (the wrapper's
# "Prompt starts with:" text, null without a wrapper); unit (cr | order | stack | folder | none);
# rows (the host rows brief prints, null: every row); hosts.<host>.wrapper and .tools.
version: 1
roles:
  - name: cr-driver
    kind: driver
    started_by: [foreman, chief-of-staff]
    writes: cr-folder
    reply: 'driver.md#Means: your end'
    card: driver.md
    first: 'chantier cr-driver for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Drives one chantier change request through rounds, ship, CI and hand-back, updating its branch by rebase only. Started by the steering session (the Foreman, or the Chief of Staff in direct mode).'
    unit: cr
    rows: [driver-messages-steering-direct, driver-hand-back, start-driver, start-generic-agent, end-turn-background, stop-own-background-task, compact, write-guard]
    hosts:
      claude:
        wrapper: agents/cr-driver.md
        tools: [Agent, Bash, PowerShell, Read, Edit, Write, Grep, Glob, SendMessage, Monitor, TaskStop]
      copilot:
        wrapper: com.github.copilot/agents/chantier-cr-driver.agent.md
        tools: [agent, execute, read, edit, search, read_agent, write_agent, list_agents]
  - name: release-driver
    kind: driver
    started_by: [foreman, chief-of-staff]
    writes: none
    reply: 'release-driver-end.md#Release driver: the end'
    card: driver.md
    first: 'chantier release-driver for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Runs a chantier release CR by the project''s own release procedure, updating its branch by rebase only; asks the user before each irreversible action. Started by the steering session (the Foreman, or the Chief of Staff in direct mode).'
    unit: cr
    rows: [driver-messages-steering-direct, driver-hand-back, start-driver, start-generic-agent, end-turn-background, stop-own-background-task, compact, write-guard]
    hosts:
      claude:
        wrapper: agents/release-driver.md
        tools: [Bash, PowerShell, Read, Edit, Write, Grep, Glob, SendMessage, Monitor, TaskStop]
      copilot:
        wrapper: com.github.copilot/agents/chantier-release-driver.agent.md
        tools: [execute, read, edit, search, read_agent, write_agent, list_agents]
  - name: stack-driver
    kind: driver
    started_by: [foreman, chief-of-staff]
    writes: none
    reply: 'driver.md#Means: your end'
    card: driver.md
    first: 'chantier stack-driver for the stack of batch <batch>, in the project <root>.'
    description: 'Orders, restacks by rebase only and ships a chantier stack of pull requests, and makes one stack on the forge, merged in one go. Started by the steering session (the Foreman, or the Chief of Staff in direct mode).'
    unit: stack
    rows: [driver-messages-steering-direct, driver-hand-back, start-driver, start-generic-agent, end-turn-background, stop-own-background-task, compact, write-guard]
    hosts:
      claude:
        wrapper: agents/stack-driver.md
        tools: [Agent, Bash, PowerShell, Read, Edit, Write, Grep, Glob, SendMessage, Monitor, TaskStop]
      copilot:
        wrapper: com.github.copilot/agents/chantier-stack-driver.agent.md
        tools: [agent, execute, read, edit, search, read_agent, write_agent, list_agents]
  - name: qa-driver
    kind: driver
    started_by: [foreman, chief-of-staff]
    writes: none
    reply: 'driver.md#Means: your end'
    card: driver.md
    first: 'chantier qa-driver for <folder> of batch <batch>, in the project <root>.'
    description: 'Uses the project''s head as its user would and leaves its findings in a work folder. Started by the steering session (the Foreman, or the Chief of Staff in direct mode).'
    unit: order
    rows: [driver-messages-steering-direct, driver-hand-back, start-driver, start-generic-agent, end-turn-background, stop-own-background-task, compact, write-guard]
    hosts:
      claude:
        wrapper: agents/qa-driver.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob, SendMessage, Monitor, TaskStop]
      copilot:
        wrapper: com.github.copilot/agents/chantier-qa-driver.agent.md
        tools: [execute, read, edit, search, read_agent, write_agent, list_agents]
  - name: coder
    kind: worker
    started_by: [driver]
    writes: worktree
    reply: 'coder.md#Your part'
    card: coder.md
    first: 'chantier coder for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Implements one round of one chantier CR in its worktree; never commits. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/coder.md
        tools: [Bash, PowerShell, Read, Edit, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-coder.agent.md
        tools: [execute, read, edit, search]
  - name: conflict-resolver
    kind: worker
    started_by: [driver]
    writes: worktree
    reply: 'conflict-resolver.md#Your part'
    card: conflict-resolver.md
    first: 'chantier conflict-resolver for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Rebases one chantier CR branch (never a merge) and resolves its conflicts, keeping both intents. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/conflict-resolver.md
        tools: [Bash, PowerShell, Read, Edit, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-conflict-resolver.agent.md
        tools: [execute, read, edit, search]
  - name: debugger
    kind: worker
    started_by: [driver]
    writes: worktree
    reply: 'debugger.md#Your part'
    card: debugger.md
    first: 'chantier debugger for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Finds and proves why a chantier CR''s check is red; hands over a diagnosis, not a fix. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/debugger.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-debugger.agent.md
        tools: [execute, read, edit, search]
  - name: inspector
    kind: review-step
    started_by: [driver]
    writes: worktree
    reply: 'inspector.md#Your part'
    card: inspector.md
    first: 'chantier inspector for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Reviews one chantier round''s diff and returns a JSON verdict; read-only. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/inspector.md
        tools: [Bash, PowerShell, Read, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-inspector.agent.md
        tools: [execute, read, search]
  - name: investigator
    kind: worker
    started_by: [driver]
    writes: worktree
    reply: 'investigator.md#Your part'
    card: investigator.md
    first: 'chantier investigator for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Maps the code a chantier CR touches before its first round; read-only. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/investigator.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-investigator.agent.md
        tools: [execute, read, edit, search]
  - name: verifier
    kind: worker
    started_by: [driver]
    writes: worktree
    reply: 'verifier.md#Your part'
    card: verifier.md
    first: 'chantier verifier for <cr> "<title>" of batch <batch>, in the project <root>.'
    description: 'Proves at the pushed head that a chantier CR does what its specification says. Started by a Driver.'
    unit: cr
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/verifier.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-verifier.agent.md
        tools: [execute, read, edit, search]
  - name: spec-writer
    kind: worker
    started_by: [chief-of-staff]
    writes: none
    reply: 'spec-writer.md#End'
    card: spec-writer.md
    first: 'chantier spec-writer for the Chief of Staff, in the project <root>.'
    description: 'Writes one chantier CR''s Change Specification from its grill. Started by the Chief of Staff.'
    unit: folder
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/spec-writer.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-spec-writer.agent.md
        tools: [execute, read, edit, search]
  - name: spec-critic
    kind: critic
    started_by: [chief-of-staff, griller]
    writes: none
    reply: 'spec-critic.md#Reply'
    card: spec-critic.md
    first: 'chantier spec-critic for the Chief of Staff, in the project <root>.'
    description: 'Checks one chantier CR''s Change Specification before it is final; read-only. Started by the Chief of Staff or a Griller.'
    unit: folder
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/spec-critic.md
        tools: [Bash, PowerShell, Read, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-spec-critic.agent.md
        tools: [execute, read, search]
  - name: board-griller
    kind: worker
    started_by: [surface-server]
    writes: none
    reply: 'griller.md#Started from the board'
    card: griller.md
    first: 'chantier board-griller for the board, in the project <root>.'
    description: 'Grills one chantier CR from the web board, headless. Started only by the surface server, never as a subagent.'
    unit: folder
    rows: []
    hosts:
      claude:
        wrapper: agents/board-griller.md
        tools: [Bash, PowerShell, Read, Write, Edit, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-board-griller.agent.md
        tools: [execute, read, edit, search]
  - name: retro-critic
    kind: critic
    started_by: [foreman, chief-of-staff]
    writes: none
    reply: 'retro-critic.md#Reply'
    card: retro-critic.md
    first: 'chantier retro-critic for the Chief of Staff, in the project <root>.'
    description: 'Judges the points of a list of changes chantier proposes on its own (a retro, a report''s suggestions), keep, merge or drop; read-only. Started by the Foreman or the Chief of Staff.'
    unit: none
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/retro-critic.md
        tools: [Bash, PowerShell, Read, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-retro-critic.agent.md
        tools: [execute, read, search]
  - name: demo-explorer
    kind: worker
    started_by: [chief-of-staff]
    writes: none
    reply: 'demo-explorer.md#Your part'
    card: demo-explorer.md
    first: 'chantier demo-explorer for the Chief of Staff of batch <batch>, in the project <root>.'
    description: 'Studies a stack ready to merge and writes the demo of what it delivers; read-only on the code. Started by the Chief of Staff.'
    unit: none
    rows: [end-turn-background]
    hosts:
      claude:
        wrapper: agents/demo-explorer.md
        tools: [Bash, PowerShell, Read, Write, Grep, Glob]
      copilot:
        wrapper: com.github.copilot/agents/chantier-demo-explorer.agent.md
        tools: [execute, read, edit, search]
  - name: chief-of-staff
    kind: steering
    started_by: [user]
    writes: none
    reply: none
    card: ../../chief-of-staff/SKILL.md
    first: null
    description: 'Steers the user''s chantier project: grills, plans and runs its batches. Started by the user.'
    unit: none
    rows: null
    hosts:
      claude:
        wrapper: null
        tools: []
      copilot:
        wrapper: null
        tools: []
  - name: griller
    kind: steering
    started_by: [user]
    writes: none
    reply: none
    card: ../../griller/SKILL.md
    first: null
    description: 'Grills one chantier CR with the user until its specification can be written. Started by the user.'
    unit: none
    rows: [start-spec-critic, end-turn-background, compact, reload-after-compact]
    hosts:
      claude:
        wrapper: null
        tools: []
      copilot:
        wrapper: null
        tools: []
  - name: foreman
    kind: steering
    started_by: [chief-of-staff]
    writes: none
    reply: none
    card: foreman.md
    first: null
    description: 'Runs one chantier batch for the Chief of Staff: starts its Drivers and records their ends. Started by the Chief of Staff.'
    unit: none
    rows: null
    hosts:
      claude:
        wrapper: null
        tools: []
      copilot:
        wrapper: null
        tools: []
