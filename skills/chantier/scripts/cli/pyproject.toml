[project]
name = "chantier"
version = "0.3.1"
description = "CLI of the chantier skill (Chief of Staff): batch state, events, gates, waits, ship, cost."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chantier = "chantier.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chantier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
