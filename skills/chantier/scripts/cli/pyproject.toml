[project]
name = "chantier"
version = "0.4.0"
description = "CLI of the chantier skill: the CR lifecycle, the batch's limits and record, orders and asks, the long gate, cost."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chantier = "chantier.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chantier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
