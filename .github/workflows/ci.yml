name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: just check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # macOS on Intel: the arm64 pool can run out of runners. The name stays: main requires it.
          - os: macos-latest
            runner: macos-15-intel
    runs-on: ${{ matrix.runner || matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Git identity for the test repositories
        run: |
          git config --global user.name "chantier CI"
          git config --global user.email "ci@example.com"
      - run: just check
