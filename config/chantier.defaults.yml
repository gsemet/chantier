# chantier's shipped defaults: the lowest layer of the configuration.
#
# Do not edit this file in an install: set your own values in your chantier.yaml (the
# project's, or its planning surface's), where `default` takes a value back to this file's.
# It changes only by a release, together with the agent files, which a test keeps equal to it.
#
# One model per plugin role on each host: the exact identifier the role's agent file declares.
#
# `escalation` is the model a role starts on when a CR escalates (concepts.md, "Escalation"). Only
# a role that carries one here may set it in a chantier.yaml. On a host that cannot start a named
# agent with a model (Copilot), the escalated role starts as a generic agent with that model.
#
# The `timing` block of each host: the steering session's wake, the prompt cache's TTL and the
# CI re-runs. The values are what the cards said before the configuration held them. A column
# overrides the general value of its host; a setting a column never reads is not set under it.
# `cache_ttl` is measured once (Claude Code, 2026-11-17) or unproved (Copilot): see the hosts'
# cards. The Claude Code `steering_wake` is general: only the session column reads it, and it is
# 55m so that the Foreman wakes at worst once every 55 minutes, under the session's 1-hour cache
# (the CLI's bound stays 60 minutes).
hosts:
  claude:
    timing:
      steering_wake: 55m
      cache_ttl: 5m
      ci_reruns: 1
      session:
        cache_ttl: 1h
    roles:
      board-griller:
        model: claude-opus-5-5
      coder:
        model: claude-sonnet-5-5
        escalation: claude-opus-5-5
      conflict-resolver:
        model: claude-sonnet-5-5
        escalation: claude-opus-5-5
      cr-driver:
        model: claude-sonnet-5-5
      debugger:
        model: claude-sonnet-5-5
        escalation: claude-opus-5-5
      demo-explorer:
        model: claude-sonnet-5-5
      inspector:
        model: claude-sonnet-5-5
      investigator:
        model: claude-sonnet-5-5
      qa-driver:
        model: claude-sonnet-5-5
      release-driver:
        model: claude-sonnet-5-5
      retro-critic:
        model: claude-opus-5-5
      spec-critic:
        model: claude-opus-5-5
      spec-writer:
        model: claude-opus-5-5
      stack-driver:
        model: claude-sonnet-5-5
      verifier:
        model: claude-sonnet-5-5
  copilot:
    timing:
      steering_wake: 4m
      cache_ttl: 5m
      ci_reruns: 1
    roles:
      board-griller:
        model: claude-opus-5.5
      coder:
        model: gpt-6.1-sol
        escalation: claude-opus-5.5
      conflict-resolver:
        model: gpt-6.1-terra
        escalation: claude-opus-5.5
      cr-driver:
        model: claude-sonnet-5.5
      debugger:
        model: gpt-6.1-terra
        escalation: claude-opus-5.5
      demo-explorer:
        model: gpt-5.6-luna
      inspector:
        model: gpt-6.1-sol
      investigator:
        model: gpt-5.6-luna
      qa-driver:
        model: claude-sonnet-5.5
      release-driver:
        model: claude-opus-5.5
      retro-critic:
        model: claude-opus-5.5
      spec-critic:
        model: claude-opus-5.5
      spec-writer:
        model: claude-opus-5.5
      stack-driver:
        model: claude-opus-5.5
      verifier:
        model: gpt-6.1-terra

# How many CRs are specified at once on the project, and how many slots a new batch gets.
specifying:
  parallel: 4   # the most CRs being specified at once on the project
batch:
  slots: 4      # the slots `open` gives a batch when no --slots is given

# How a watcher of this project is woken.
events:
  wake_every: 20s   # a watcher tells no sooner than this after its start or its last telling (one wake per window)
