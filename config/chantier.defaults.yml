# chantier's shipped defaults: the lowest layer of the configuration.
#
# Do not edit this file in an install: set your own values in your chantier.yaml (the
# project's, or its planning surface's), where `default` takes a value back to this file's.
# It changes only by a release, together with the agent files, which a test keeps equal to it.
#
# One model per plugin role on each host: the exact identifier the role's agent file declares.
hosts:
  claude:
    roles:
      coder:
        model: claude-sonnet-5-5
      conflict-resolver:
        model: claude-sonnet-5-5
      cr-driver:
        model: claude-sonnet-5-5
      debugger:
        model: claude-sonnet-5-5
      demo-explorer:
        model: claude-sonnet-5-5
      inspector:
        model: claude-sonnet-5-5
      investigator:
        model: claude-sonnet-5-5
      qa-driver:
        model: claude-sonnet-5-5
      release-driver:
        model: claude-sonnet-5-5
      retro-critic:
        model: claude-opus-5-5
      spec-critic:
        model: claude-opus-5-5
      spec-writer:
        model: claude-opus-5-5
      stack-driver:
        model: claude-sonnet-5-5
      verifier:
        model: claude-sonnet-5-5
  copilot:
    roles:
      coder:
        model: gpt-6.1-sol
      conflict-resolver:
        model: gpt-6.1-terra
      cr-driver:
        model: claude-sonnet-5.5
      debugger:
        model: gpt-6.1-terra
      demo-explorer:
        model: gpt-5.6-luna
      inspector:
        model: gpt-6.1-sol
      investigator:
        model: gpt-5.6-luna
      qa-driver:
        model: claude-sonnet-5.5
      release-driver:
        model: claude-opus-5.5
      retro-critic:
        model: claude-opus-5.5
      spec-critic:
        model: claude-opus-5.5
      spec-writer:
        model: claude-opus-5.5
      stack-driver:
        model: claude-opus-5.5
      verifier:
        model: gpt-6.1-terra
